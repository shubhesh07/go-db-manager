version: "2"
run:
  go: "1.23"
linters:
  enable:
    - bodyclose
    - gosec
    - misspell
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
  disable:
    - exhaustruct
    - gochecknoglobals
    - godot
    - nlreturn
    - wsl
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (*bytes.Buffer).WriteString
        - (*bytes.Buffer).Write
        - (*strings.Builder).WriteString
        - (*strings.Builder).WriteByte
        - (*strings.Builder).WriteRune
        - fmt.Fprintf
    gosec:
      severity: medium
      confidence: medium
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    misspell:
      locale: US
      ignore-rules:
        - orginal # real production column name (keep_orginal)
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
          - govet
        path: _test\.go
      - linters:
          - forbidigo
        path: cmd/
      - linters:
          - gosec
        text: "G115" # int64<->uint64 reinterpretation in the BIT scanner is intentional
      - linters:
          - gosec
        text: "G306" # generated .go source is not a secret
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
